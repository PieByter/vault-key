urface">Credential Details</span></div></div></header><main class="relative w-full pt-16 bg-background min-h-screen px-margin-mobile"><div class="flex flex-col w-full pb-safe">

<div class="flex flex-col gap-1 px-1">

<button class="w-full h-14 bg-surface-container rounded-lg flex items-center justify-between px-4 hover:bg-surface-container-high transition-colors text-left focus:outline-none focus:ring-1 focus:ring-primary" id="vault_folder">

</button>
</div>
</section>
<!-- Core Credentials Box -->
<section class="bg-surface-container rounded-xl flex flex-col relative overflow-hidden">
<!-- Subtle internal gradient indicating secure area -->
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent pointer-events-none"></div>
<!-- Website URL -->
<div class="relative flex flex-col group p-4 border-b border-surface-container-highest/50">
<label class="font-label-sm text-label-sm text-primary mb-2" for="url">Website URL</label>
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded bg-surface-bright flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface-variant" style="font-size: 18px;">language</span>
</div>
<input class="w-full bg-transparent border-none focus:outline-none text-body-lg font-code-md text-on-surface placeholder:text-on-surface-variant/50" id="url" type="url" value="https://dashboard.acmecorp.com"/>
<button aria-label="Open URL" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-bright text-on-surface-variant transition-colors active:scale-95 shrink-0">
<span class="material-symbols-outlined">open_in_new</span>
</button>
</div>
</div>
<!-- Username -->

<label class="font-label-sm text-label-sm text-on-surface-variant mb-2" for="username">Username / Email</label>

<span class="material-symbols-outlined text-on-surface-variant w-8 text-center shrink-0">person</span>
<input class="w-full bg-transparent border-none focus:outline-none text-body-lg font-medium text-on-surface placeholder:text-on-surface-variant/50" id="username" placeholder="Enter username" type="text" value="j.doe@acmecorp.com"/>
<button aria-label="Copy Username" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-bright text-on-surface-variant transition-colors active:scale-95 shrink-0">

</div>

<input class="w-full bg-transparent border-none focus:outline-none text-body-lg font-code-md text-on-surface placeholder:text-on-surface-variant/50 tracking-widest" id="password" type="password" value="xk9$#mP2q!Lz"/>
<div class="flex items-center shrink-0">
<button aria-label="Toggle Password Visibility" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-bright text-on-surface-variant transition-colors active:scale-95" id="togglePasswordVisibility">
<span class="material-symbols-outlined" id="visibilityIcon" style="font-size: 20px;">visibility_off</span>
</button>
<button aria-label="Copy Password" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-bright text-on-surface-variant transition-colors active:scale-95">
<span class="material-symbols-outlined" style="font-size: 20px;">content_copy</span>
</button>
</div>
</div>
<!-- Password Strength Indicator (simulated for edit state) -->
<div class="mt-4 flex flex-col gap-2 w-full pr-12 pl-11">
<div class="flex gap-1 h-1.5 w-full rounded-full overflow-hidden bg-surface-bright">
<div class="h-full bg-secondary w-full"></div>
<div class="h-full bg-secondary w-full"></div>
<div class="h-full bg-secondary w-full"></div>
<div class="h-full bg-secondary w-full"></div>
</div>
<span class="text-label-sm font-label-sm text-secondary text-right">Excellent</span>
</div>
</div>

<!-- Generate Password CTA -->
<button class="w-full relative overflow-hidden bg-surface-container-high hover:bg-surface-bright rounded-xl p-4 flex items-center gap-4 transition-all duration-300 group active:scale-[0.98]">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary shrink-0 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">casino</span>
</div>
<div class="flex flex-col items-start flex-1 text-left">

</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>

<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/5 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-700"></div>
</button>

<button aria-label="Delete Entry" class="h-14 px-6 rounded-lg bg-error-container text-on-error-container font-medium text-body-lg flex items-center justify-center gap-2 hover:bg-error transition-colors active:scale-95 shrink-0">
<span class="material-symbols-outlined" style="font-size: 20px;">delete</span>

<span class="relative z-10">Save Changes</span>
<span class="material-symbols-outlined relative z-10" style="font-size: 20px;">check</span>

</button>

<!-- Spacer to ensure scroll clears fixed bottom bar -->
<div class="h-6"></div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const toggleBtn = document.getElementById('togglePasswordVisibility');
    const passwordInput = document.getElementById('password');
    const visibilityIcon = document.getElementById('visibilityIcon');

    if(toggleBtn && passwordInput && visibilityIcon) {
      toggleBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        
        // Add a small tactile animation class
        visibilityIcon.classList.add('scale-75', 'opacity-50');
        setTimeout(() => {
          visibilityIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
          visibilityIcon.classList.remove('scale-75', 'opacity-50');
        }, 150);
      });
    }
    
    // Add simple ripple effect to copy buttons for interaction delight
    const copyBtns = document.querySelectorAll('[aria-label*="Copy"]');
    copyBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const icon = btn.querySelector('.material-symbols-outlined');
        const originalIcon = icon.textContent;
        icon.textContent = 'check';
        icon.classList.add('text-secondary');
        
        // Haptic feedback if available
        if (window.navigator && window.navigator.vibrate) {
          window.navigator.vibrate(50);
        }
        
        setTimeout(() => {
          icon.textContent = originalIcon;
          icon.classList.remove('text-secondary');
        }, 1500);
      });
    });
  });
</script></main></body></html>
