<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_108 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_108" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_108');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const container = document.querySelector('.totp-timer-container');
const circle = document.querySelector('.totp-progress-ring__circle');
if (circle) {
  const radius = circle.r.baseVal.value;
  const circumference = radius * 2 * Math.PI;
  circle.style.strokeDasharray = `${circumference} ${circumference}`;
  circle.style.strokeDashoffset = circumference;

  function setProgress(percent) {
    const offset = circumference - (percent / 100) * circumference;
    circle.style.strokeDashoffset = offset;
  }

  let timeLeft = 30;
  function updateTimer() {
    const percent = (timeLeft / 30) * 100;
    setProgress(percent);
    timeLeft -= 0.1;
    if (timeLeft < 0) timeLeft = 30;
    requestAnimationFrame(updateTimer);
  }
  updateTimer();
}

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_108 -->
</body>
</html>
