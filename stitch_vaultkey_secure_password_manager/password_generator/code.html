<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Slider logic
    const slider = document.getElementById('length-slider');
    const valueDisplay = document.getElementById('length-value');
    const progress = document.getElementById('slider-progress');
    const thumb = document.getElementById('slider-thumb');

    function updateSlider() {
      const val = parseInt(slider.value);
      const min = parseInt(slider.min);
      const max = parseInt(slider.max);
      const percentage = ((val - min) / (max - min)) * 100;
      
      valueDisplay.textContent = val;
      progress.style.transform = `scaleX(${percentage}%)`;
      thumb.style.left = `${percentage}%`;
    }

    slider.addEventListener('input', updateSlider);
    updateSlider();

    // Toggle logic for visual state
    const toggles = document.querySelectorAll('input[type="checkbox"]');
    toggles.forEach(toggle => {
      toggle.addEventListener('change', (e) => {
        const container = e.target.parentElement;
        const knob = container.querySelector('span');
        
        if (e.target.checked) {
          container.classList.remove('bg-surface-variant');
          container.classList.add('bg-primary');
          knob.classList.remove('translate-x-0', 'bg-outline');
          knob.classList.add('translate-x-6', 'bg-on-primary');
        } else {
          // Ensure at least one is checked
          const checkedCount = document.querySelectorAll('input[type="checkbox"]:checked').length;
          if (checkedCount === 0) {
            e.target.checked = true; // Revert
            // Play a little shake animation
            container.classList.add('animate-[shake_0.5s_ease-in-out]');
            setTimeout(() => container.classList.remove('animate-[shake_0.5s_ease-in-out]'), 500);
            return;
          }
          container.classList.remove('bg-primary');
          container.classList.add('bg-surface-variant');
          knob.classList.remove('translate-x-6', 'bg-on-primary');
          knob.classList.add('translate-x-0', 'bg-outline');
        }
      });
      // Initial state
      if(!toggle.checked) {
          const container = toggle.parentElement;
          const knob = container.querySelector('span');
          container.classList.remove('bg-primary');
          container.classList.add('bg-surface-variant');
          knob.classList.remove('translate-x-6', 'bg-on-primary');
          knob.classList.add('translate-x-0', 'bg-outline');
      }
    });

    // Copy interaction
    const copyBtn = document.getElementById('copy-btn');
    const copyIcon = document.getElementById('copy-icon');
    
    copyBtn.addEventListener('click', () => {
        copyIcon.textContent = 'check';
        copyIcon.classList.add('text-secondary');
        setTimeout(() => {
            copyIcon.textContent = 'content_copy';
            copyIcon.classList.remove('text-secondary');
        }, 1500);
    });

    // Refresh animation
    const refreshBtn = document.getElementById('refresh-btn');
    const refreshIcon = refreshBtn.querySelector('span');
    
    refreshBtn.addEventListener('click', () => {
        refreshIcon.classList.add('animate-spin');
        setTimeout(() => refreshIcon.classList.remove('animate-spin'), 500);
        
        // Mock new password generation visual effect
        const pwd = document.getElementById('generated-password');
        pwd.style.opacity = 0;
        setTimeout(() => {
            pwd.textContent = 'Tz4' + Math.random().toString(36).substring(2, 8) + '!#k9';
            pwd.style.opacity = 1;
        }, 150);
    });

    // Simple close animation (mock)
    const closeBtn = document.getElementById('close-modal-btn');
    const sheet = document.getElementById('password-generator-sheet');
    const backdrop = document.getElementById('password-generator-modal-backdrop');
    
    closeBtn.addEventListener('click', () => {
        sheet.classList.remove('translate-y-0');
        sheet.classList.add('translate-y-full');
        backdrop.style.opacity = '0';
        setTimeout(() => {
             // Normally would remove from DOM or hide
             // document.body.removeChild(backdrop);
        }, 300);
    });
  });
</script>
